```yaml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Iris API model
        run: |
          python -c "from sklearn.datasets import load_iris; from sklearn.ensemble import RandomForestClassifier; import joblib; X,y=load_iris(return_X_y=True); model=RandomForestClassifier(n_estimators=100, random_state=42); model.fit(X,y); joblib.dump(model, 'model.joblib')"

      - name: Verify Iris model
        run: |
          ls -l model.joblib
          python -c "import joblib; joblib.load('model.joblib'); print('Iris model loaded successfully')"

      - name: Train Churn candidates
        run: python src/train/train.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

      - name: Run lint
        run: ruff check src tests
```